name: ci

# Validates every commit on every branch and every pull request.
# Node 22 is the engines floor; Node 24 catches deprecations early.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert zero runtime dependencies
        # The privacy claim rests on there being nothing else in the bundle.
        # devDependencies are fine; a runtime one is a design change and should
        # fail here rather than be noticed after publishing.
        run: |
          COUNT=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          if [ "$COUNT" != "0" ]; then
            echo "This package must have zero runtime dependencies, found $COUNT"
            exit 1
          fi

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Build library
        run: pnpm run build

      - name: Verify published file list
        run: pnpm pack --dry-run

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        # A backstop for the repository rule that no real 2FA secret may ever be
        # committed. The primary guards are the synthetic fixture generator and
        # tests/security/no-real-secrets.test.ts; this catches anything that got
        # in by another route. Pinned rather than floating, and fetched directly
        # because the official action needs a licence key for organisations.
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
