name: publish-npm

# Triggered by a `v*.*.*` tag, or a scoped `@hexpro/google-auth-secret-retriever@*`
# tag. Publishes to npm and attaches the single-file offline app to a release, so
# somebody who downloads that file can check its hash against the build log.
#
# No secrets. Publishing is authenticated by OIDC against the trusted publisher
# configured on the package at npmjs.com, which names this repository and this
# filename. Renaming this file, or moving the repository, breaks publishing until
# that configuration is updated to match, and that is the intended behaviour.

on:
  push:
    tags:
      - 'v*.*.*'
      - '@hexpro/google-auth-secret-retriever@*'

permissions:
  contents: write
  id-token: write # npm provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      # Nothing else in this workflow uses npm; it is here because it is the only
      # client that can do the OIDC exchange. See the publish step.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag ref does not match ci.yml's branch filter, so a release used to be
      # validated more loosely than an ordinary push: no coverage thresholds, no
      # dependency assertion, no check of what would actually ship. These three
      # bring the release path back up to the same bar.
      - name: Assert zero runtime dependencies
        run: |
          COUNT=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          if [ "$COUNT" != "0" ]; then
            echo "This package must have zero runtime dependencies, found $COUNT"
            exit 1
          fi

      - name: Verify the version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == @hexpro/google-auth-secret-retriever@* ]]; then
            TAG_VERSION="${TAG#@hexpro/google-auth-secret-retriever@}"
          else
            TAG_VERSION="${TAG#v}"
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION"
            exit 1
          fi

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build:all

      - name: Record the offline app's hash
        run: |
          FILE=dist/google-auth-secret-retriever.html
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          BYTES=$(wc -c < "$FILE" | tr -d ' ')
          {
            echo "### Offline app"
            echo ""
            echo "- size: $BYTES bytes"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published file list
        run: pnpm pack --dry-run

      # Published with the npm client rather than pnpm, which is the one place in
      # this repository that is true. There is no token: the `id-token: write`
      # permission above lets the runner prove to npm that it is this workflow in
      # this repository, and npm checks that against the trusted publisher
      # configured on the package. Nothing long lived is stored anywhere, which
      # is the point, because npm now caps a write token at ninety days and a
      # secret that has to be rotated four times a year is a secret that will one
      # day be rotated badly.
      #
      # pnpm cannot do this yet. Its OIDC support landed in the 11 line, and this
      # repository is pinned to pnpm 10 for everything else, so `pnpm publish`
      # here would look for a token, find none, and fail.
      #
      # Provenance is not decoration on a package like this one. It is a signed
      # statement of which commit and which workflow produced the tarball, so
      # somebody who does not trust us can still check that what is on the
      # registry is what is in the repository.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Attach the offline app to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/google-auth-secret-retriever.html
          generate_release_notes: true
